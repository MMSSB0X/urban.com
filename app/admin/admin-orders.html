<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Admin | Orders</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="admin-style.css"/>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
        <script>
        // Set Theme instantly
        const theme = localStorage.getItem('adm-theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
        }
        // Set Sidebar instantly
        if (localStorage.getItem('sidebar-collapsed') === 'true') {
            document.documentElement.classList.add('sidebar-is-collapsed');
        }
    </script>
</head>
<body>

    <header class="mobile-header">
        <div class="sidebar-logo"><i class="ph-fill ph-plant"></i> Urban Admin</div>
        <button class="mobile-menu-btn" id="open-mobile-menu"><i class="ph-bold ph-list"></i></button>
    </header>

    <div class="overlay" id="overlay"></div>
    <div class="mobile-bottom-menu" id="bottomMenu">
        <div class="drag-handle-zone" id="dragZone"><div class="drag-handle"></div></div>
        <div class="mobile-nav-grid">
            <a href="admin-dashboard.html" class="mobile-nav-item"><i class="ph-bold ph-squares-four"></i> Dashboard</a>
            <a href="admin-orders.html" class="mobile-nav-item active"><i class="ph-bold ph-package"></i> Orders</a>
            <a href="admin-users.html" class="mobile-nav-item"><i class="ph-bold ph-users"></i> Users</a>
            <a href="admin-settings.html" class="mobile-nav-item"><i class="ph-bold ph-gear"></i> Settings</a>
        </div>
    </div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <i class="ph-fill ph-plant"></i>
            <span class="logo-text">Urban Admin</span>
        </div>
        
        <nav class="nav-links">
            <a href="admin-dashboard.html" class="nav-item "><i class="ph-bold ph-squares-four"></i> <span class="logo-text">Dashboard</span></a>
            <a href="admin-orders.html" class="nav-item active"><i class="ph-bold ph-package"></i> <span class="logo-text">Orders</span></a>
            <a href="admin-users.html" class="nav-item"><i class="ph-bold ph-users"></i> <span class="logo-text">Users</span></a>
            <a href="admin-settings.html" class="nav-item"><i class="ph-bold ph-gear"></i> <span class="logo-text">Settings</span></a>
        </nav>

        <button id="toggle-sidebar" class="sidebar-toggle-btn">
            <i class="ph-bold ph-caret-double-left"></i>
            <span class="logo-text">Collapse</span>
        </button>

        <div class="nav-item logout-btn" style="color: var(--danger); cursor: pointer; padding-top: 0;">
            <i class="ph-bold ph-sign-out"></i> <span class="logo-text">Logout</span>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h2 class="page-title">Manage Orders</h2>
        </div>

        <div class="admin-table-container">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody">
                    <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <div class="modal" id="orderModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3 style="font-weight: 800;">Order Details</h3>
                <button onclick="document.getElementById('orderModal').classList.remove('active')" style="background:none; border:none; font-size:1.5rem; color:var(--text-grey); cursor:pointer;"><i class="ph-bold ph-x"></i></button>
            </div>
            <div id="modal-order-content" style="color: var(--text-main); font-size: 0.9rem; line-height: 1.6;"></div>
        </div>
    </div>

    <script type="module" src="admin-core.js"></script>
    <script type="module">
        import { db } from "./firebase.js";
        import { collection, getDocs, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const tbody = document.getElementById('orders-tbody');

        // Helper to dynamically style the <select> dropdown
        window.updateSelectColor = function(selectElement) {
            const val = selectElement.value;
            if (val === 'Delivered') selectElement.style.cssText = 'padding:0.25rem; border-radius:0.5rem; border:none; outline:none; font-weight:700; background: rgba(16,185,129,0.1); color: #10b981;';
            else if (val === 'Processing') selectElement.style.cssText = 'padding:0.25rem; border-radius:0.5rem; border:none; outline:none; font-weight:700; background: rgba(245,158,11,0.1); color: #f59e0b;';
            else if (val === 'Shipped') selectElement.style.cssText = 'padding:0.25rem; border-radius:0.5rem; border:none; outline:none; font-weight:700; background: rgba(59,130,246,0.1); color: #3b82f6;';
            else if (val === 'Cancelled') selectElement.style.cssText = 'padding:0.25rem; border-radius:0.5rem; border:none; outline:none; font-weight:700; background: rgba(239,68,68,0.1); color: #ef4444;';
        }

        async function loadOrders() {
            try {
                const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                tbody.innerHTML = '';
                
                if(snap.empty) tbody.innerHTML = '<tr><td colspan="6">No orders found.</td></tr>';

                snap.forEach(docSnap => {
                    const o = docSnap.data();
                    const id = docSnap.id;
                    const shortId = id.substring(0, 8).toUpperCase();
                    const date = o.createdAt ? o.createdAt.toDate().toLocaleDateString() : 'N/A';
                    const currentStatus = o.status || 'Processing';
                    
                    window[`order_${id}`] = o;

                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight:700; color:var(--primary);">#${shortId}</td>
                            <td>${date}</td>
                            <td>${o.shippingAddress?.name || 'Unknown'}</td>
                            <td style="font-weight:800;">EGP${o.totalAmount.toFixed(2)}</td>
                            <td>
                                <select id="sel-${id}" onchange="updateStatus('${id}', this)" style="padding:0.25rem; border-radius:0.5rem; border:none; outline:none; font-weight:700;">
                                    <option value="Processing" ${currentStatus==='Processing'?'selected':''}>Processing</option>
                                    <option value="Shipped" ${currentStatus==='Shipped'?'selected':''}>Shipped</option>
                                    <option value="Delivered" ${currentStatus==='Delivered'?'selected':''}>Delivered</option>
                                    <option value="Cancelled" ${currentStatus==='Cancelled'?'selected':''}>Cancelled</option>
                                </select>
                            </td>
                            <td>
                                <button class="btn-main" style="padding:0.5rem; background:var(--primary-light); color:var(--primary); margin-right: 0.5rem;" onclick="viewOrder('${id}')"><i class="ph-bold ph-eye"></i></button>
                                <button class="btn-danger" style="padding:0.5rem;" onclick="deleteOrder('${id}')"><i class="ph-bold ph-trash"></i></button>
                            </td>
                        </tr>
                    `;
                    // Apply color immediately on load
                    setTimeout(() => window.updateSelectColor(document.getElementById(`sel-${id}`)), 0);
                });
            } catch(e) { console.error(e); }
        }
        loadOrders();

        window.updateStatus = async (id, selectEl) => {
            try {
                window.updateSelectColor(selectEl); // Change color instantly
                await updateDoc(doc(db, "orders", id), { status: selectEl.value });
            } catch(e) { alert("Failed to update status"); }
        }

        window.deleteOrder = async (id) => {
            if(confirm("Are you sure you want to permanently delete this order?")) {
                try {
                    await deleteDoc(doc(db, "orders", id));
                    loadOrders(); // Refresh table
                } catch(e) { alert("Failed to delete order."); }
            }
        }

        window.viewOrder = (id) => {
            const o = window[`order_${id}`];
            let itemsHtml = o.items.map(i => `<li>ID: ${i.id} (Qty: ${i.qty})</li>`).join('');
            
            document.getElementById('modal-order-content').innerHTML = `
                <div style="background: var(--primary-light); padding: 1rem; border-radius: 0.75rem; margin-bottom: 1rem;">
                    <p><strong>Payment:</strong> ${o.paymentMethod}</p>
                    <p><strong>Total:</strong> EGP${o.totalAmount.toFixed(2)}</p>
                </div>
                <h4 style="margin-bottom:0.5rem;">Shipping Address</h4>
                <p style="color: var(--text-grey); margin-bottom: 1rem;">
                    ${o.shippingAddress.name}<br>
                    ${o.shippingAddress.address}<br>
                    ${o.shippingAddress.city}, ${o.shippingAddress.zip}
                </p>
                <h4 style="margin-bottom:0.5rem;">Items Ordered</h4>
                <ul style="color: var(--text-grey); padding-left: 1.5rem;">${itemsHtml}</ul>
            `;
            document.getElementById('orderModal').classList.add('active');
        }
    </script>
</body>
</html>
