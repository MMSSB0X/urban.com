<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Order Success - Urban Harvest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="style.css"/>
        <link rel="stylesheet" href="assets/remix/remixicon.css">
    <link rel="stylesheet" href="assets/fa/css/all.css">
    <script src="assets/phosphor/index.js"></script>
</head>

<body style="background-color: var(--bg-main); display: flex; flex-direction: column; min-height: 100vh;">

    <main class="main-content" style="margin: auto; max-width: 500px; text-align: center; padding: 3rem 1.5rem;">
        
        <div class="success-animation-circle">
            <i class="fa-solid fa-check"></i>
        </div>

        <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text-main);">Payment Successful!</h1>
        <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem;">Your local harvest is being prepared. We'll notify you when it's on the way.</p>

        <div class="checkout-card" style="text-align: left; margin-bottom: 2rem;">
            <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem;">Order Reference</p>
            <h3 id="order-id-display" style="font-size: 1.25rem; font-weight: 700; color: var(--primary);">#UH-LOADING</h3>
        </div>

        <a href="orders.html" class="btn-main" style="margin-bottom: 1rem; width: 100%;">Track Order</a>
        <a href="index.html" class="btn-outline" style="width: 100%;">Return to Store</a>
        
    </main>

    <script>
        // Retrieve Order ID from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        if(orderId) {
            document.getElementById('order-id-display').innerText = "#" + orderId.substring(0, 8).toUpperCase();
        }
    </script>
</body>
</html>
