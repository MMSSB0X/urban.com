        <script>
        // Set Theme instantly
        const theme = localStorage.getItem('adm-theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
        }

            document.documentElement.classList.add('sidebar-is-collapsed');
        }
    </script>

    <script type="module" src="admin-core.js"></script>
    <script type="module">
        import { applyTheme } from "./admin-core.js";
        import { db } from "./firebase.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        document.addEventListener('DOMContentLoaded', async () => {
            // --- THEME LOGIC ---
            const currentTheme = localStorage.getItem('adm-theme') || 'system';
            const buttons = document.querySelectorAll('.theme-btn');

            buttons.forEach(btn => {
                if(btn.dataset.themeVal === currentTheme) {
                    btn.style.borderColor = 'var(--primary)';
                    btn.style.color = 'var(--primary)';
                    btn.style.background = 'var(--primary-light)';
                }
                
                btn.addEventListener('click', () => {
                    buttons.forEach(b => {
                        b.style.borderColor = 'var(--border-color)';
                        b.style.color = 'var(--text-main)';
                        b.style.background = 'transparent';
                    });
                    btn.style.borderColor = 'var(--primary)';
                    btn.style.color = 'var(--primary)';
                    btn.style.background = 'var(--primary-light)';
                    applyTheme(btn.dataset.themeVal);
                });
            });

            // --- STORE CONFIG LOGIC ---
            const configRef = doc(db, "system", "config");
            
            // Load existing config
            try {
                const snap = await getDoc(configRef);
                if (snap.exists()) {
                    const data = snap.data();
                    if(data.announcement) document.getElementById('cfg-announcement').value = data.announcement;
                    if(data.deliveryFee) document.getElementById('cfg-delivery').value = data.deliveryFee;
                }
            } catch(e) { console.log("Config load error:", e); }

            // Save config
            document.getElementById('store-config-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('save-cfg-btn');
                btn.innerHTML = '<i class="ph-bold ph-spinner ph-spin"></i> Saving...';
                
                try {
                    await setDoc(configRef, {
                        announcement: document.getElementById('cfg-announcement').value,
                        deliveryFee: parseFloat(document.getElementById('cfg-delivery').value) || 0
                    }, { merge: true });
                    
                    // Simple inline feedback
                    btn.innerHTML = '<i class="ph-bold ph-check"></i> Saved!';
                    setTimeout(() => btn.innerHTML = 'Save Configuration', 2000);
                } catch(error) {
                    alert("Failed to save settings.");
                    btn.innerHTML = 'Save Configuration';
                }
            });
        });
    </script>
