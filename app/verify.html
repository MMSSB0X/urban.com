<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Verify Delivery</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
        <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <header class="header">
        <div class="container header-top">
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="page-title">Verify Delivery</h2>
            <div style="width: 2.5rem;"></div>
        </div>
    </header>

    <main class="main-content" style="max-width: 400px; text-align: center; margin: 0 auto;">
        <div style="font-size: 4rem; color: #10b981; margin: 2rem 0 1rem;"><i class="ph-fill ph-shield-check"></i></div>
        <h3 style="font-weight: 800; font-size: 1.5rem; margin-bottom: 0.5rem;">Delivery Code</h3>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 2rem;">Enter the 4-digit code you received in your inbox.</p>

        <form id="verify-form">
            
            <div style="text-align: left; margin-bottom: 0.5rem; font-size: 0.8rem; font-weight: 700; color: var(--text-grey);">Order ID</div>
            <input type="text" id="order-id" placeholder="Order ID" required readonly 
                   style="width:100%; padding:1rem; border-radius:0.75rem; border:1px solid var(--card-border); background: #e2e8f0; color: #64748b; margin-bottom:1.5rem; outline:none; font-weight:700; text-align:center;">
            
            <div style="text-align: left; margin-bottom: 0.5rem; font-size: 0.8rem; font-weight: 700; color: var(--text-grey);">4-Digit Verification Code</div>
            <input type="text" id="verify-code" placeholder="----" maxlength="4" required 
                   style="width:100%; padding:1rem; border-radius:0.75rem; border:2px solid var(--primary); background:var(--input-bg); margin-bottom:1.5rem; outline:none; font-size: 2rem; font-weight:800; letter-spacing: 1rem; text-align:center;">
            
            <button type="submit" class="btn-main" style="width: 100%; justify-content: center; height: 3.5rem; font-size: 1.1rem;" id="verify-btn">
                Verify & Complete
            </button>
        </form>
    </main>
    
    <div id="toast-container"></div>
    <script type="module" src="script.js"></script>
    <script type="module">
        import { db } from "./firebase.js";
        import { showToast } from "./toast.js";
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // ==========================================
        // 1. AUTO-FILL LOGIC FROM URL
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const orderIdParam = urlParams.get('orderId');
        const msgIdParam = urlParams.get('msgId');

        const orderInput = document.getElementById('order-id');
        const codeInput = document.getElementById('verify-code');

        if (orderIdParam && orderIdParam !== "undefined" && orderIdParam !== "") {
            // Auto-fill the input with the exact ID
            orderInput.value = orderIdParam;
            // Auto-focus the code input so the user can just type immediately
            setTimeout(() => codeInput.focus(), 300);
        } else {
            // If they didn't come from a link, let them type it manually
            orderInput.removeAttribute('readonly');
            orderInput.style.background = 'var(--input-bg)';
            orderInput.style.color = 'var(--text-main)';
        }

        // ==========================================
        // 2. SUBMIT & VERIFY LOGIC
        // ==========================================
        document.getElementById('verify-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('verify-btn');
            
            const finalOrderId = orderInput.value.trim();
            const finalCode = codeInput.value.trim();
            
            if (!finalOrderId) return showToast("Order ID is missing!", "error");

            btn.innerHTML = '<i class="ph-bold ph-spinner ph-spin"></i> Verifying...';
            btn.disabled = true;
            
            try {
                const orderRef = doc(db, "orders", finalOrderId);
                const orderSnap = await getDoc(orderRef);

                if (!orderSnap.exists()) throw new Error("Order not found.");
                const orderData = orderSnap.data();

                if (orderData.verificationCode !== finalCode) throw new Error("Invalid Code! Please check your inbox.");
                if (orderData.status === 'Delivered') throw new Error("Order already delivered.");

                // Update Order to Delivered
                await updateDoc(orderRef, { status: "Delivered", verifiedAt: new Date() });
                
                // Update the Inbox Message to hide the Verify Button
                if (msgIdParam && msgIdParam !== "undefined") {
                    await updateDoc(doc(db, "messages", msgIdParam), { verified: true });
                }

                showToast("Order Successfully Delivered!", "success");
                btn.style.background = "#10b981";
                btn.innerHTML = '<i class="ph-bold ph-check-circle"></i> Verified';
                
                // Redirect back to orders after success
                setTimeout(() => window.location.href = "orders.html", 1500);

            } catch (error) {
                showToast(error.message, "error");
                btn.innerHTML = 'Verify & Complete';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
