<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Payment Methods - Urban Harvest</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body style="background-color: var(--bg-main);">
    
    <header class="header">
        <div class="container header-top" style="margin-bottom: 0;">
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="page-title">Payment Methods</h2>
            <div style="width: 2.5rem;"></div> 
        </div>
    </header>

    <main class="main-content" style="max-width: 600px;">
        <button class="add-new-btn" id="open-add-modal">
            <i class="fa-solid fa-plus"></i> Add New Card
        </button>

        <div id="payments-container">
            <div style="text-align:center; padding: 2rem;"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
        </div>
    </main>

    <div class="modal-overlay" id="payment-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Add New Card</h3>
                <button class="close-modal-btn" id="close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="payment-form" class="checkout-form-grid">
                <div class="input-group">
                    <input type="text" id="pay-name" placeholder="Cardholder Name" required />
                </div>
                <div class="input-group">
                    <input type="text" id="pay-number" placeholder="Card Number (e.g. 4242...)" required maxlength="19"/>
                </div>
                <div class="input-group half">
                    <input type="text" id="pay-exp" placeholder="MM/YY" required maxlength="5"/>
                </div>
                <div class="input-group half">
                    <input type="text" id="pay-cvc" placeholder="CVC" required maxlength="4"/>
                </div>
                <button type="submit" class="btn-main" style="grid-column: span 2; margin-top: 1rem;" id="save-payment-btn">
                    Save Card
                </button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="custom-alert-modal">
        <div class="modal-content" style="max-width: 400px; text-align: center; padding: 2rem 1.5rem;">
            <div style="width: 4rem; height: 4rem; border-radius: 50%; background: rgba(239, 68, 68, 0.1); color: #ef4444; font-size: 2rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                <i class="fa-solid fa-trash"></i>
            </div>
            <h3 class="modal-title" style="margin-bottom: 0.5rem; justify-content: center;">Remove Card?</h3>
            <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; line-height: 1.5;">Are you sure you want to delete this payment method? This action cannot be undone.</p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button class="btn-cancel" id="alert-cancel-btn" style="flex: 1; height: 3rem;">Cancel</button>
                <button class="btn-danger" id="alert-confirm-btn" style="flex: 1; height: 3rem;">Remove</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script type="module">
        import { auth, db } from "./firebase.js";
        import { showToast } from "./toast.js";
        import { collection, query, where, getDocs, addDoc, deleteDoc, doc, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        let currentUser = null;

        // Add Modal Logic
        const addModal = document.getElementById('payment-modal');
        document.getElementById('open-add-modal').addEventListener('click', () => addModal.classList.add('active'));
        document.getElementById('close-modal').addEventListener('click', () => addModal.classList.remove('active'));

        async function fetchPayments() {
            const container = document.getElementById('payments-container');
            try {
                const q = query(collection(db, "payments"), where("userId", "==", currentUser.uid), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);
                container.innerHTML = '';
                
                if (snapshot.empty) {
                    container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 2rem;">No saved payment methods. Add one above!</p>`;
                    return;
                }

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    
                    let brandIcon = '<i class="fa-regular fa-credit-card" style="color: var(--text-main);"></i>';
                    let brandName = "Card";
                    
                    if (data.cardNumber.startsWith('4')) {
                        brandIcon = '<i class="fa-brands fa-cc-visa" style="color: #1a1f71;"></i>'; brandName = "Visa";
                    } else if (data.cardNumber.startsWith('5')) {
                        brandIcon = '<i class="fa-brands fa-cc-mastercard" style="color: #ff5f00;"></i>'; brandName = "Mastercard";
                    }

                    const last4 = data.cardNumber.slice(-4) || "****";

                    container.innerHTML += `
                        <div class="list-card payment-card" id="card-${docId}">
                            <div class="payment-header">
                                <div class="payment-title">
                                    <div class="payment-logo">${brandIcon}</div>
                                    <div>
                                        <h4>${brandName} ending in ${last4}</h4>
                                        <p class="text-muted" style="font-size: 0.75rem;">Expires ${data.expiryDate}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="card-actions">
                                <button class="action-btn text-red" onclick="deletePayment('${docId}')"><i class="fa-solid fa-trash"></i> Remove</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                container.innerHTML = `<p style="text-align: center; color: #ef4444; padding: 2rem;">Error loading payments.</p>`;
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) { currentUser = user; fetchPayments(); } 
            else { window.location.href = "login.html"; }
        });

        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-payment-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            const newPayment = {
                userId: currentUser.uid,
                cardholderName: document.getElementById('pay-name').value,
                cardNumber: document.getElementById('pay-number').value.replace(/\s+/g, ''), 
                expiryDate: document.getElementById('pay-exp').value,
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "payments"), newPayment);
                showToast("Card saved successfully!");
                document.getElementById('payment-form').reset();
                addModal.classList.remove('active');
                fetchPayments();
            } catch (error) {
                showToast("Failed to save card", "error");
            } finally {
                btn.innerHTML = 'Save Card'; btn.disabled = false;
            }
        });

        // Global Custom Delete Logic
        window.deletePayment = function(id) {
            const confirmModal = document.getElementById('custom-alert-modal');
            const confirmBtn = document.getElementById('alert-confirm-btn');
            const cancelBtn = document.getElementById('alert-cancel-btn');

            cancelBtn.onclick = () => confirmModal.classList.remove('active');
            
            confirmBtn.onclick = async () => {
                confirmBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                try {
                    await deleteDoc(doc(db, "payments", id));
                    document.getElementById(`card-${id}`).style.display = 'none'; 
                    showToast("Card removed");
                } catch (error) {
                    showToast("Failed to remove", "error");
                }
                confirmModal.classList.remove('active');
                confirmBtn.innerHTML = 'Remove'; // Reset button text
            };
            
            confirmModal.classList.add('active');
        }
    </script>
</body>
</html>
