<script type="module">
        import { auth, db } from "./firebase.js";
        // I ADDED onSnapshot TO THE IMPORT LIST BELOW!
        import { getDoc, doc, collection, query, where, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        onAuthStateChanged(auth, async (user) => {
            const loader = document.getElementById('global-loader');

            if (user) {
                // 1. Fetch User Profile Info
                let displayName = user.displayName;
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists() && userDoc.data().fullName) {
                        displayName = userDoc.data().fullName;
                    }
                } catch (err) { console.log(err); }
                
                document.getElementById('profile-name').innerText = displayName || "Urban Farmer";
                document.getElementById('profile-email').innerText = user.email;

// 2. Fetch unread messages count (Inbox Bubble)
                try {
                    const messagesQuery = query(collection(db, "messages"), where("userId", "==", user.uid), where("read", "==", false));
                    onSnapshot(messagesQuery, (snap) => {
                        const badge = document.getElementById('inbox-badge');
                        if(snap.size > 0) {
                            // Use 'flex' to perfectly center the number in the circle
                            badge.style.display = 'flex';
                            
                            // If they have more than 9 messages, show "9+" so the circle doesn't stretch
                            badge.innerText = snap.size > 9 ? '9+' : snap.size;
                        } else {
                            badge.style.display = 'none';
                        }
                    });
                } catch(e) { console.log("Badge error:", e); }

                // 3. Fetch User Stats (Orders & Points)
                try {
                    const q = query(collection(db, "orders"), where("userId", "==", user.uid));
                    const orderSnaps = await getDocs(q);
                    
                    let totalSpent = 0;
                    orderSnaps.forEach(orderDoc => {
                        totalSpent += (orderDoc.data().totalAmount || 0);
                    });

                    document.getElementById('stat-orders').innerText = orderSnaps.size;
                    document.getElementById('stat-points').innerText = Math.floor(totalSpent * 10);
                    
                } catch(error) {
                    console.log("Error loading stats:", error);
                    document.getElementById('stat-orders').innerText = "0";
                    document.getElementById('stat-points').innerText = "0";
                }
                
                // 4. HIDE LOADER WHEN DONE!
                if(loader) loader.classList.add('hidden');

            } else {
                window.location.href = "login.html";
            }
        });

        // Trigger Logout
        document.getElementById('logout-btn-full').addEventListener('click', () => {
            signOut(auth).then(() => window.location.replace("start.html"));
        });
    </script>
