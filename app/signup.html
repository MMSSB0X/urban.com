<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Urban Harvest - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css"/>
        <link rel="stylesheet" href="assets/remix/remixicon.css">
    <link rel="stylesheet" href="assets/fa/css/all.css">
    <script src="assets/phosphor/index.js"></script>
</head>
<body class="auth-page-body">

    <div class="app-container">
        <div class="app-header">
            <a href="start.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="app-title">Urban Harvest</h2>
        </div>

        <div class="welcome-text" style="padding-top: 0;">
            <div class="icon-circle"><i class="ph-fill ph-plant"></i></div>
            <h1>Create Account</h1>
        </div>

        <form id="signup-form" class="auth-form" style="padding-top: 0;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="input-group">
                    <label class="input-label">First Name</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="signup-first" placeholder="First" required />
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">Last Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="signup-last" placeholder="Last" required style="padding-left: 1rem;"/>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Mobile Number</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <input type="tel" id="signup-phone" placeholder="e.g. +20 123 456 7890" required />
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Email</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="signup-email" placeholder="Email address" required />
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="signup-password" placeholder="Create password" required minlength="6"/>
                </div>
            </div>

            <button type="submit" class="btn-main" style="margin-top: 0.5rem;">Create Account</button>
        </form>

        <div class="auth-footer" style="padding-top: 1rem;">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>
    
    <div id="toast-container"></div>
    <script type="module" src="auth.js"></script>
</body>
</html>
