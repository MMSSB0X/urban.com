<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Admin | Messaging</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="admin-style.css"/>
    <script>
        const t = localStorage.getItem('adm-theme') || 'system';
        if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.setAttribute('data-theme', 'light');
        if (localStorage.getItem('sidebar-collapsed') === 'true') document.documentElement.classList.add('sidebar-is-collapsed');
    </script>
    <style>
        .template-chip {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            text-align: left;
            width: 100%;
        }
        .template-chip:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }
        .template-chip i { font-size: 1.25rem; }
    </style>
</head>
<body>

    <header class="mobile-header">
        <div class="sidebar-logo"><i class="ph-fill ph-plant"></i> Urban Admin</div>
        <button class="mobile-menu-btn" id="open-mobile-menu"><i class="ph-bold ph-list"></i></button>
    </header>

    <div class="overlay" id="overlay"></div>
    <div class="mobile-bottom-menu" id="bottomMenu">
        <div class="drag-handle-zone" id="dragZone"><div class="drag-handle"></div></div>
        <div class="mobile-nav-grid">
            <a href="admin-dashboard.html" class="mobile-nav-item"><i class="ph-bold ph-squares-four"></i> Dashboard</a>
            <a href="admin-orders.html" class="mobile-nav-item"><i class="ph-bold ph-package"></i> Orders</a>
            <a href="admin-users.html" class="mobile-nav-item"><i class="ph-bold ph-users"></i> Users</a>
            <a href="admin-message.html" class="mobile-nav-item active"><i class="ph-bold ph-paper-plane-right"></i> Messaging</a>
            <a href="admin-settings.html" class="mobile-nav-item"><i class="ph-bold ph-gear"></i> Settings</a>
        </div>
    </div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><i class="ph-fill ph-plant"></i><span class="logo-text">Urban Admin</span></div>
        <nav class="nav-links">
            <a href="admin-dashboard.html" class="nav-item"><i class="ph-bold ph-squares-four"></i> <span class="logo-text">Dashboard</span></a>
            <a href="admin-orders.html" class="nav-item"><i class="ph-bold ph-package"></i> <span class="logo-text">Orders</span></a>
            <a href="admin-users.html" class="nav-item"><i class="ph-bold ph-users"></i> <span class="logo-text">Users</span></a>
            <a href="admin-message.html" class="nav-item active"><i class="ph-bold ph-paper-plane-right"></i> <span class="logo-text">Messaging</span></a>
            <a href="admin-settings.html" class="nav-item"><i class="ph-bold ph-gear"></i> <span class="logo-text">Settings</span></a>
        </nav>
        <button id="toggle-sidebar" class="sidebar-toggle-btn"><i class="ph-bold ph-caret-double-left"></i><span class="logo-text">Collapse</span></button>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h2 class="page-title">Broadcast Center</h2>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; max-width: 1000px;">
            
            <div class="stat-card" style="flex-direction: column; align-items: flex-start; height: fit-content;">
                <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem;">
                    <div style="width: 2.5rem; height: 2.5rem; background: rgba(59,130,246,0.1); color: #3b82f6; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;"><i class="ph-bold ph-target"></i></div>
                    <h3 style="font-weight: 800;">1. Choose Audience</h3>
                </div>
                
                <div class="input-group">
                    <label>Select Recipient</label>
                    <select id="msg-user" required style="width: 100%;">
                        <option value="ALL">📢 All Users (Global Broadcast)</option>
                        </select>
                </div>

                <div style="width: 100%; height: 1px; background: var(--border-color); margin: 1.5rem 0;"></div>

                <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
                    <div style="width: 2.5rem; height: 2.5rem; background: rgba(245,158,11,0.1); color: #f59e0b; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;"><i class="ph-bold ph-magic-wand"></i></div>
                    <h3 style="font-weight: 800;">2. Quick Templates</h3>
                </div>

                <button type="button" class="template-chip" onclick="setTemplate('🎉 Welcome to Urban Harvest! Enjoy 10% off your next order with code WELCOME10.')">
                    <i class="ph-fill ph-party-popper" style="color: #f59e0b;"></i> Welcome Promo
                </button>
                <button type="button" class="template-chip" onclick="setTemplate('🚚 Due to heavy traffic, some orders may experience a slight delay today. Thank you for your patience!')">
                    <i class="ph-fill ph-truck" style="color: #3b82f6;"></i> Delivery Delay
                </button>
                <button type="button" class="template-chip" onclick="setTemplate('🎁 Flash Sale! Get 20% off all fresh fruits this weekend only.')">
                    <i class="ph-fill ph-gift" style="color: #10b981;"></i> Flash Sale
                </button>
                <button type="button" class="template-chip" onclick="setTemplate('We apologize for the inconvenience with your recent order. A refund has been issued to your account.')">
                    <i class="ph-fill ph-warning-circle" style="color: #ef4444;"></i> Apology / Refund
                </button>
            </div>

            <div class="stat-card" style="flex-direction: column; align-items: flex-start; height: fit-content;">
                <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem;">
                    <div style="width: 2.5rem; height: 2.5rem; background: var(--primary-light); color: var(--primary); border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;"><i class="ph-bold ph-pencil-simple"></i></div>
                    <h3 style="font-weight: 800;">3. Compose Message</h3>
                </div>

                <form id="msg-form" style="width: 100%;">
                    <div class="input-group">
                        <textarea id="msg-content" rows="8" placeholder="Type your custom message here, or click a template on the left..." required style="width:100%; padding:1rem; border-radius:0.75rem; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-main); outline:none; resize:vertical; font-family:inherit;"></textarea>
                    </div>
                    
                    <button type="submit" class="btn-main" id="send-btn" style="width: 100%; justify-content: center; height: 3.5rem; font-size: 1.1rem; margin-top: 1rem;">
                        <i class="ph-bold ph-paper-plane-tilt"></i> Send Message Now
                    </button>
                </form>
            </div>

        </div>
    </main>

    <script type="module" src="admin-core.js"></script>
    <script type="module">
        import { db } from "./firebase.js";
        import { collection, getDocs, doc, setDoc, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        let allUsers = [];

        // 1. Populate User Dropdown
        async function loadUsers() {
            try {
                const snap = await getDocs(collection(db, "users"));
                const select = document.getElementById('msg-user');
                snap.forEach(documentSnap => {
                    const u = documentSnap.data();
                    allUsers.push(documentSnap.id);
                    select.innerHTML += `<option value="${documentSnap.id}">${u.fullName || 'User'} (${u.email})</option>`;
                });
            } catch(e) { console.error("Error loading users", e); }
        }
        loadUsers();

        // 2. Handle Quick Templates
        window.setTemplate = function(text) {
            const textarea = document.getElementById('msg-content');
            textarea.value = text;
            textarea.focus();
            
            // Add a little visual bounce effect
            textarea.style.transform = 'scale(1.02)';
            textarea.style.borderColor = 'var(--primary)';
            setTimeout(() => {
                textarea.style.transform = 'scale(1)';
                textarea.style.borderColor = 'var(--border-color)';
            }, 200);
        };

        // 3. Handle Sending (Upgraded to use Firebase Batch for speed)
        document.getElementById('msg-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('send-btn');
            const target = document.getElementById('msg-user').value;
            const content = document.getElementById('msg-content').value;

            // Confirm before sending Global Broadcast
            if (target === 'ALL') {
                if (!confirm(`Are you sure you want to send this message to ALL ${allUsers.length} users?`)) return;
            }

            btn.innerHTML = '<i class="ph-bold ph-spinner ph-spin"></i> Sending...';
            btn.disabled = true;

            try {
                if (target === 'ALL') {
                    // FAST BATCH WRITE for all users
                    const batch = writeBatch(db);
                    const messagesRef = collection(db, "messages");
                    
                    allUsers.forEach(uid => {
                        const newMsgRef = doc(messagesRef); // Auto-generate ID
                        batch.set(newMsgRef, {
                            userId: uid, 
                            sender: "Urban Harvest Team", 
                            type: "info", 
                            content: content, 
                            read: false, 
                            createdAt: serverTimestamp()
                        });
                    });
                    
                    await batch.commit();

                } else {
                    // Single send
                    const newMsgRef = doc(collection(db, "messages"));
                    await setDoc(newMsgRef, {
                        userId: target, 
                        sender: "Urban Harvest Team", 
                        type: "info", 
                        content: content, 
                        read: false, 
                        createdAt: serverTimestamp()
                    });
                }

                // Success Feedback
                btn.style.background = "#10b981";
                btn.innerHTML = '<i class="ph-bold ph-check-circle"></i> Sent Successfully!';
                document.getElementById('msg-form').reset();
                
                setTimeout(() => {
                    btn.style.background = "var(--primary)";
                    btn.innerHTML = '<i class="ph-bold ph-paper-plane-tilt"></i> Send Message Now';
                    btn.disabled = false;
                }, 2000);

            } catch(error) { 
                console.error(error);
                alert("Failed to send message. Check console for details."); 
                btn.innerHTML = '<i class="ph-bold ph-paper-plane-tilt"></i> Try Again';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
