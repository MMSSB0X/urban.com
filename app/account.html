<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Account - Urban Harvest</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="style.css"/>
</head>
<body style="background-color: var(--bg-main);">

    <header class="header">
        <div class="container header-top" style="margin-bottom: 0;">
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="page-title">Personal Info</h2>
            <div style="width: 2.5rem;"></div> 
        </div>
    </header>

    <main class="main-content" style="max-width: 600px;">
        
        <div class="profile-card-centered" style="margin-bottom: 2rem;">
            <div class="avatar-wrapper">
                <div class="profile-avatar-large">
                    <i class="ph-fill ph-user"></i>
                </div>
                <!-- <button class="edit-avatar-btn" onclick="alert('Photo upload coming soon!')">
                    <i class="fa-solid fa-camera"></i>
                </button> -->
            </div>
            <h3 id="display-name">Loading...</h3>
            <p id="display-email">user@email.com</p>
        </div>

        <form id="account-form" class="checkout-card">
            <div class="checkout-form-grid">
                <div class="input-group half">
                    <label class="input-label" style="margin-bottom: 0.5rem;">First Name</label>
                    <input type="text" id="acc-first" required />
                </div>
                <div class="input-group half">
                    <label class="input-label" style="margin-bottom: 0.5rem;">Last Name</label>
                    <input type="text" id="acc-last" required />
                </div>
                <div class="input-group">
                    <label class="input-label" style="margin-bottom: 0.5rem;">Mobile Number</label>
                    <input type="tel" id="acc-phone" required />
                </div>
                <div class="input-group">
                    <label class="input-label" style="margin-bottom: 0.5rem;">Email Address (Read Only)</label>
                    <input type="email" id="acc-email" disabled style="background-color: var(--badge-bg); cursor: not-allowed;" />
                </div>
            </div>
            <button type="submit" class="btn-main" style="margin-top: 2rem; width: 100%;">Save Changes</button>
        </form>
    </main>

    <div id="toast-container"></div>

<script type="module">
        import { auth, db } from "./firebase.js";
        import { showToast } from "./toast.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                
                document.getElementById('acc-email').value = user.email;
                document.getElementById('display-email').innerText = user.email;
                
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        document.getElementById('acc-first').value = data.firstName || '';
                        document.getElementById('acc-last').value = data.lastName || '';
                        document.getElementById('acc-phone').value = data.phone || '';
                        document.getElementById('display-name').innerText = data.fullName || user.displayName || 'Urban Farmer';
                    } else {
                        document.getElementById('display-name').innerText = user.displayName || 'Urban Farmer';
                    }
                } catch (err) {
                    console.log("Error loading user data:", err);
                    document.getElementById('display-name').innerText = user.displayName || 'Urban Farmer';
                }

            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById('account-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            const first = document.getElementById('acc-first').value;
            const last = document.getElementById('acc-last').value;
            const phone = document.getElementById('acc-phone').value;

            try {
                await updateProfile(currentUser, { displayName: `${first} ${last}` });
                
                // USE SETDOC WITH MERGE: TRUE -> Creates it if it doesn't exist, updates if it does!
                await setDoc(doc(db, "users", currentUser.uid), {
                    firstName: first,
                    lastName: last,
                    fullName: `${first} ${last}`,
                    phone: phone
                }, { merge: true });

                document.getElementById('display-name').innerText = `${first} ${last}`;
                showToast("Profile updated successfully!");
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 1000);

            } catch (error) {
                console.error(error);
                showToast("Failed to update profile", "error");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>

</html>
