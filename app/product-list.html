<div id="global-loader" class="global-loader">
        <div class="loader-content">
            <div class="loader-icon">
                <i class="ph-fill ph-plant"></i>
            </div>
            <div class="loader-ring"></div>
        </div>
        <p class="loader-text">loading Catalog...</p>
    </div>

    <header class="header">
        <div class="container header-top">
            <!-- <a href="index.html" class="back-btn" style="margin-right: 1rem;">
                <i class="fa-solid fa-arrow-left"></i>
            </a> -->
            <!-- <h2 class="page-title" style="text-align: left; flex: 1;">Our Catalog</h2> -->
                         <div class="logo">
                <i class="ph-fill ph-plant" style="font-size: 2rem;"></i>
                <h1>URBAN</h1>
            </div>
            <button class="cart-btn" onclick="window.location.href='cart.html'">
                <i class="ri-shopping-basket-line" style="font-size: 1.2rem;"></i>
                <span class="cart-badge" style="display: none;">0</span>
            </button>
        </div>

        <div class="container search-container">
            <div class="search-bar" style="position: relative;">
                <i class="fa-solid fa-magnifying-glass text-muted"></i>
                <input type="text" class="smart-search-input" placeholder="Search for tomatoes, honey..."/>
                <div class="search-suggestions hidden"></div>
            </div>
            
<div class="filter-scroll" id="category-filters">
                <div class="chip active" data-category="all" style="cursor: pointer;">All Products</div>
                <div class="chip" data-category="vegetables" style="cursor: pointer;">Vegetables</div>
                <div class="chip" data-category="fruits" style="cursor: pointer;">Fruits</div>
                <!-- <div class="chip" data-category="poultry" style="cursor: pointer;">Poultry</div>
                <div class="chip" data-category="livestock" style="cursor: pointer;">Livestock</div> -->
            </div>
        </div>
    </header>

    <main class="main-content">
        <div id="auth-state" style="display: none;"></div>

        <section>
            <div class="section-header">
                <h3 class="section-title" id="list-page-title">All Products</h3>
            </div>
            
            <div class="product-grid" id="all-products-grid">
                <p style="text-align: center; width: 100%; color: var(--text-muted);">Loading produce...</p>
            </div>
        </section>
    </main>

        </a>

<i class="ph-fill ph-squares-four"  ></i>
