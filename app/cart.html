<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Your Cart - Urban Harvest</title>
        <script type="module" src="script.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="global-loader" class="global-loader">
        <div class="loader-content">
            <div class="loader-icon">
                <i class="ph-fill ph-plant"></i>
            </div>
            <div class="loader-ring"></div>
        </div>
        <p class="loader-text">Harvesting data...</p>
    </div>
    <header class="header">
        <div class="container header-top" style="margin-bottom: 0;">
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="page-title">Your Cart</h2>
            <div style="width: 2.5rem;"></div> 
        </div>
    </header>

    <main class="main-content">
        <div class="cart-layout">
            
            <div class="cart-items-section" id="cart-items-container">
                <div style="text-align:center; padding: 2rem;">Loading cart...</div>
            </div>

            <div class="cart-summary-section">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span class="font-medium" id="cart-subtotal">---</span>
                </div>
                <div class="summary-row">
                    <span>Delivery</span>
                    <span class="text-primary font-medium">FREE</span>
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="cart-total">---</span>
                </div>
                <button class="checkout-btn" onclick="window.location.href='checkout.html'">
                    Proceed to Checkout
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            
        </div>
    </main>

    <nav class="side-nav" id="sideNav">
        <a href="index.html" class="nav-item">
            <i class="ri-store-2-line nav-icon" data-inactive="ri-store-2-line" data-active="ri-store-2-fill"></i>
            <span class="nav-label">Market</span>
        </a>
                <a href="product-list.html" class="nav-item">
            <i class="ph ph-squares-four nav-icon" data-inactive="ph ph-book-open-text" data-active="ph-fill ph-book-open-text"></i>
            <span class="nav-label">Products</span>
        </a>
        <!-- <a href="#" class="nav-item">
            <i class="ph ph-book-open-text nav-icon" data-inactive="ph ph-book-open-text" data-active="ph-fill ph-book-open-text"></i>
            <span class="nav-label">Learn</span>
        </a> -->
        <!-- <a href="cart.html" class="nav-item active">
            <i class="ri-shopping-cart-fill nav-icon" data-inactive="ri-shopping-cart-line" data-active="ri-shopping-cart-fill"></i>
            <span class="nav-label">Cart</span>
        </a> -->
                <a href="inbox.html" class="nav-item">
            <i class="ph ph-tray nav-icon" data-inactive="ph ph-tray" data-active="ph-fill ph-tray"></i>
            <!-- <i class="ph ph-squares-four nav-icon" data-inactive="ph ph-book-open-text" data-active="ph-fill ph-book-open-text"></i> -->
            <span class="nav-label">Inbox</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="ri-user-line nav-icon" data-inactive="ri-user-line" data-active="ri-user-fill"></i>
            <span class="nav-label">Profile</span>
        </a>
    </nav>

</body>
</html>
